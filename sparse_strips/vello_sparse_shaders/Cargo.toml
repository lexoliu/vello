[package]
name = "vello_sparse_shaders"
# When updating, also update the version in the workspace dependency in the root Cargo.toml
version = "0.2.0"
description = "Provide WESL shaders linked to WGSL and GLSL for the `vello_hybrid` backends."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
# There are no platform specific docs.
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
naga = { workspace = true, features = ["wgsl-in", "glsl-out"], optional = true }
# Pinned exactly: the 0.4.1 releases of wesl and its wgsl-* crates require rustc 1.96,
# newer than our toolchain. The wgsl-*/wesl-macros pins force wesl's own `^0.4`
# transitive requirements to resolve to 0.4.0 as well.
wesl = { version = "=0.4.0", optional = true }
wesl-macros = { version = "=0.4.0", optional = true }
wgsl-parse = { version = "=0.4.0", optional = true }
wgsl-types = { version = "=0.4.0", optional = true }

[features]
glsl = ["dep:naga"]
# Used only by the `package-shaders` bin to regenerate the checked-in
# `src/generated/compiled_shaders.rs`; consumers never build this.
shadergen = [
    "dep:naga",
    "dep:wesl",
    "dep:wesl-macros",
    "dep:wgsl-parse",
    "dep:wgsl-types",
]

[[bin]]
name = "vello_sparse_shaders"
path = "src/main.rs"
test = false

[[bin]]
name = "package-shaders"
path = "src/bin/package-shaders.rs"
required-features = ["shadergen"]
test = false

[lints]
workspace = true
